name: Validate package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n ha_core/rootfs/usr/local/bin/ha-core-entrypoint

  # The App Store ships only published Releases of this repository (registry
  # ref_policy: release, WOOW addon pipeline #134). When package passes on a
  # push to main, the Store's shared workflow publishes the Release for a
  # config.yaml version that has none yet; a released version is left alone.
  # This workflow runs on pushes to every branch, so the if: limits it to main.
  release:
    name: Release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main

  # Upgrade comparison (WOOW addon pipeline #89): a PR that changes an addon
  # version is compared with the version users run now; undeclared breaking
  # configuration changes block it (see AGENTS.md item 3). Category 1 only:
  # these addons are built on the device, so there is no SBOM to hand over
  # and the vulnerability comparison is #90. No needs: and no path filter, so
  # a PR that changes no version passes in seconds; on push it passes at once.
  upgrade-comparison:
    name: Upgrade comparison
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
